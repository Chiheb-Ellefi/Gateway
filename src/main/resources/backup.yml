eureka:
  client:
    service-url:
      defaultZone: https://user:password@localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
    secure-port-enabled: true
    secure-port: ${server.port}
    non-secure-port-enabled: false
    home-page-url: https://localhost:${server.port}/
    status-page-url: https://localhost:${server.port}/actuator/info
    health-check-url: https://localhost:${server.port}/actuator/health
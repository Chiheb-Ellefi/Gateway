apiVersion: v1
kind: Pod
metadata:
  name: gateway-pod
  namespace: gateway
  labels:
    app: gateway
spec:
  containers:
    - name: gateway
      image: gateway:latest
      imagePullPolicy: Never
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      envFrom:
        - configMapRef:
            name: gateway-configmap
        - secretRef:
            name: gateway-secret
      resources:
        requests:
          cpu: "1"
          memory: "1Gi"
          ephemeral-storage: "3Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
          ephemeral-storage: "5Gi"
      startupProbe:
        httpGet:
          port: http
          scheme: HTTP
          path: "/actuator/health/liveness"
        periodSeconds: 5
        failureThreshold: 30
        initialDelaySeconds: 10
      livenessProbe:
        httpGet:
          port: http
          scheme: HTTP
          path: "/actuator/health/liveness"
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      readinessProbe:
        httpGet:
          port: http
          scheme: HTTP
          path: "/actuator/health/readiness"
        periodSeconds: 5
        timeoutSeconds: 3
        failureThreshold: 3
      lifecycle:
        preStop:
          exec:
            command: [ "sh", "-c", "sleep 5" ]
  restartPolicy: Always
  terminationGracePeriodSeconds: 30
  dnsPolicy: ClusterFirst




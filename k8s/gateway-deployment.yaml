apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  template:
    metadata:
      name: gateway-pod
      namespace: gateway
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: "ghcr.io/chiheb-ellefi/gateway:1.0.0"
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: gateway-configmap
            - secretRef:
                name: gateway-secret
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
              ephemeral-storage: "3Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
              ephemeral-storage: "5Gi"
          startupProbe:
            httpGet:
              port: http
              scheme: HTTP
              path: "/actuator/health/liveness"
            periodSeconds: 5
            failureThreshold: 30
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              port: http
              scheme: HTTP
              path: "/actuator/health/liveness"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              port: http
              scheme: HTTP
              path: "/actuator/health/readiness"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst




---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: gateway
  labels:
    app: gateway
spec:
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: http
  type: ClusterIP
